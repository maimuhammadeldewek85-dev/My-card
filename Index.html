<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identity Card - Mai Muhammad</title>
  
  <style>
    :root {
      /* Base Card Physical Dimensions (CR-80 standard ratio: 85.6mm x 54mm) */
      --card-width-mm: 85.6mm;
      --card-height-mm: 54mm;
      --card-aspect-ratio: 1.585185;
      --card-screen-width: 480px;
      --card-screen-height: calc(var(--card-screen-width) / var(--card-aspect-ratio));
      
      /* Metallic Pink Color Palette */
      --color-metallic-base-1: #e28db6;
      --color-metallic-base-2: #bd598c;
      --color-metallic-base-3: #f5c4dc;
      --color-metallic-base-4: #8e3160;
      --color-accent-pink: #fce4ec;
      --color-accent-pink-hover: #f8bbd0;
      --color-text-primary: #2d0c1e;
      --color-text-secondary: #5e2142;
      --color-text-muted: #854267;
      --color-disabled: #aa909e;
      
      /* Visual Accents & Lighting Effects */
      --card-border-radius: 14px;
      --card-border-light: rgba(255, 255, 255, 0.65);
      --card-border-shadow: rgba(80, 20, 50, 0.25);
      --card-surface-sheen: linear-gradient(
        115deg,
        rgba(255, 255, 255, 0.55) 0%,
        rgba(255, 255, 255, 0.15) 30%,
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.08) 75%,
        rgba(255, 255, 255, 0.25) 100%
      );
      --card-metallic-gradient: linear-gradient(
        135deg,
        #f1b8d4 0%,
        #d873a8 25%,
        #bb4f87 50%,
        #e9a3c9 75%,
        #f7d6e6 100%
      );
      
      /* Elevation Shadows */
      --shadow-ambient: 0 20px 40px -10px rgba(70, 15, 45, 0.35),
                        0 8px 16px -6px rgba(0, 0, 0, 0.2);
      --shadow-focus: 0 0 0 3px #8e3160, 0 0 0 6px #fce4ec;

      /* Spacing & Font Sizes */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 12px;
      --spacing-lg: 16px;
      --spacing-xl: 24px;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: #1a0f16;
      background-image: 
        radial-gradient(circle at 50% 20%, #3a1c2d 0%, #170a12 80%);
      color: var(--color-accent-pink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
      perspective: 1200px;
      -webkit-font-smoothing: antialiased;
    }

    .app-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-xl);
      width: 100%;
      max-width: 600px;
    }

    .card-container {
      width: 100%;
      max-width: var(--card-screen-width);
      height: var(--card-screen-height);
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
      border-radius: var(--card-border-radius);
      box-shadow: var(--shadow-ambient);
      touch-action: manipulation;
    }

    .id-card {
      width: 100%;
      height: 100%;
      background: var(--card-metallic-gradient);
      border-radius: var(--card-border-radius);
      position: relative;
      overflow: hidden;
      display: flex;
      padding: clamp(12px, 3.5vw, 20px);
      border: 1px solid var(--card-border-light);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8),
                  inset 0 -1px 2px rgba(0, 0, 0, 0.2);
    }

    /* Metallic Shimmer & Light Sheen Overlay */
    .id-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--card-surface-sheen);
      pointer-events: none;
      z-index: 2;
    }

    /* Subtle Micro Holographic Grain Pattern */
    .id-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 0);
      background-size: 8px 8px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 1;
    }

    .card-content {
      position: relative;
      z-index: 3;
      display: flex;
      width: 100%;
      height: 100%;
      gap: clamp(10px, 2.5vw, 18px);
    }

    .left-section {
      flex: 0 0 38%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: space-between;
    }

    .photo-frame {
      width: clamp(75px, 20vw, 105px);
      height: clamp(75px, 20vw, 105px);
      border-radius: 12px;
      background-color: var(--color-accent-pink);
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .profile-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Fallback Initials Avatar */
    .avatar-fallback {
      display: none;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--color-text-secondary), var(--color-metallic-base-4));
      color: var(--color-accent-pink);
      font-weight: 700;
      font-size: clamp(22px, 5vw, 32px);
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
    }

    .identity-details {
      margin-top: auto;
      width: 100%;
    }

    .full-name {
      font-size: clamp(14px, 3.2vw, 17px);
      font-weight: 800;
      color: var(--color-text-primary);
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .role-title {
      font-size: clamp(10px, 2.3vw, 12px);
      font-weight: 700;
      color: var(--color-metallic-base-4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .organization-name {
      font-size: clamp(8.5px, 1.9vw, 10.5px);
      font-weight: 600;
      color: var(--color-text-secondary);
      line-height: 1.2;
      margin-top: 1px;
    }

    .right-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 1px solid rgba(142, 49, 96, 0.25);
      padding-left: clamp(10px, 2.5vw, 16px);
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1.5vw, 10px);
      margin-top: var(--spacing-xs);
    }

    .contact-item {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      border-radius: 6px;
      padding: 2px 4px;
      margin: -2px -4px;
      transition: background-color 0.2s ease;
    }

    .contact-item:focus-visible {
      outline: none;
      box-shadow: var(--shadow-focus);
      background-color: rgba(255, 255, 255, 0.3);
    }

    .contact-item:hover {
      background-color: rgba(255, 255, 255, 0.25);
    }

    .contact-label {
      font-size: clamp(7.5px, 1.6vw, 9px);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--color-text-muted);
    }

    .contact-value {
      font-size: clamp(10.5px, 2.4vw, 12.5px);
      font-weight: 600;
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    /* Social Icons Row */
    .social-row {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.5vw, 10px);
      margin-top: auto;
      padding-top: var(--spacing-xs);
    }

    .social-link {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-primary);
      text-decoration: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .social-link:hover:not(.disabled) {
      background: var(--color-accent-pink);
      color: var(--color-metallic-base-4);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }

    .social-link:focus-visible {
      outline: none;
      box-shadow: var(--shadow-focus);
    }

    .social-link.disabled {
      color: var(--color-disabled);
      background: rgba(0, 0, 0, 0.06);
      border-color: rgba(0, 0, 0, 0.08);
      cursor: not-allowed;
      opacity: 0.55;
    }

    .social-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .actions-bar {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .print-btn {
      background: linear-gradient(135deg, var(--color-metallic-base-2), var(--color-metallic-base-4));
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
      min-height: 44px;
      min-width: 44px;
    }

    .print-btn:hover {
      background: linear-gradient(135deg, var(--color-metallic-base-1), var(--color-metallic-base-2));
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .print-btn:focus-visible {
      outline: none;
      box-shadow: var(--shadow-focus);
    }

    .print-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @media print {
      @page {
        size: auto;
        margin: 0;
      }

      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }

      .app-wrapper {
        max-width: none !important;
        gap: 0 !important;
      }

      .actions-bar {
        display: none !important;
      }

      .card-container {
        width: var(--card-width-mm) !important;
        height: var(--card-height-mm) !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        transform: none !important;
        box-shadow: none !important;
        border-radius: 3.18mm !important;
        page-break-inside: avoid;
      }

      .id-card {
        border-radius: 3.18mm !important;
        padding: 3.5mm !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .photo-frame {
        width: 19mm !important;
        height: 19mm !important;
        border-radius: 2mm !important;
      }

      .full-name {
        font-size: 8.5pt !important;
      }

      .role-title {
        font-size: 6.5pt !important;
      }

      .organization-name {
        font-size: 5.5pt !important;
      }

      .contact-label {
        font-size: 4.5pt !important;
      }

      .contact-value {
        font-size: 6.5pt !important;
      }

      .social-link {
        width: 5mm !important;
        height: 5mm !important;
        background: transparent !important;
        border: none !important;
      }

      .social-icon {
        width: 3.5mm !important;
        height: 3.5mm !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card-container {
        transition: none !important;
        transform: none !important;
      }
    }

    /* Responsive scaling on small mobile screens */
    @media (max-width: 420px) {
      :root {
        --card-screen-width: 100%;
      }
      
      .id-card {
        padding: 12px;
      }
    }
  </style>
</head>

  <script>
    
    // Image loading error handling (shows avatar initials "MM")
    function handleImageError(imgElement) {
      imgElement.style.display = 'none';
      const fallback = document.getElementById('avatarFallback');
      if (fallback) {
        fallback.style.display = 'flex';
      }
    }

    // Interactive 3D tilt movement on mousemove
    (function initCardTilt() {
      const cardContainer = document.getElementById('cardContainer');
      if (!cardContainer) return;

      // Respect reduced motion user settings
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) return;

      const maxTilt = 12; // Maximum tilt angle in degrees

      cardContainer.addEventListener('mousemove', (e) => {
        const rect = cardContainer.getBoundingClientRect();
        const x = e.clientX - rect.left; // Mouse position x within container
        const y = e.clientY - rect.top;  // Mouse position y within container
        
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        // Calculate normalized tilt values (-1 to +1)
        const tiltX = ((y - centerY) / centerY) * -maxTilt;
        const tiltY = ((x - centerX) / centerX) * maxTilt;

        cardContainer.style.transform = `perspective(1000px) rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg) scale3d(1.02, 1.02, 1.02)`;
        cardContainer.style.boxShadow = `
          ${-tiltY * 1.5}px ${tiltX * 1.5 + 20}px 35px rgba(70, 15, 45, 0.4),
          0 8px 16px -6px rgba(0, 0, 0, 0.25)
        `;
      });

      cardContainer.addEventListener('mouseleave', () => {
        // Reset card back to default resting position smoothly
        cardContainer.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
        cardContainer.style.boxShadow = 'var(--shadow-ambient)';
      });
    })();
  </script>
